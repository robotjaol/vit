[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotjaol-vit-study"
version = "0.1.0"
description = "Readable Vision Transformer implementations for education"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["torch>=2.0", "einops>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyter>=1.0", "torchvision>=0.15", "matplotlib>=3.7", "tqdm>=4.66"]

[tool.setuptools.packages.find]
include = ["vit_pytorch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
